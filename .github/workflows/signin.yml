name: 'GameMale Cloud Sign-in'

on:
  schedule:
    - cron: '17 16 * * *'   # 每天 北京时间 00:17
    - cron: '43 6 * * *'    # 每天 北京时间 14:43
  workflow_dispatch:        # 允许在 GitHub 页面手动点 Run workflow 测试

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # 未配置 SESSION_COOKIES 时优雅跳过（不刷失败记录）；配置后会正常执行
      - name: Check config
        id: cfg
        run: |
          if [ -z "${{ secrets.SESSION_COOKIES }}" ]; then
            echo "::warning::未配置 SESSION_COOKIES，本次跳过。请按 README 设置 Secret 后再运行。"
            echo "ready=0" >> $GITHUB_OUTPUT
          else
            echo "ready=1" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.cfg.outputs.ready == '1'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.cfg.outputs.ready == '1'
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Run Cloud Sign-in
        if: steps.cfg.outputs.ready == '1'
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SESSION_COOKIES: ${{ secrets.SESSION_COOKIES }}
        run: python gamemale_cloud.py

      - name: Commit Asset Record
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f gold_record.txt ]; then
            git add gold_record.txt
            git commit -m "chore: 更新金币对比基准" || echo "今天金币没有变化，跳过保存"
            git push || true
          fi
